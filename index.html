<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced To-Do List | CodSoft Task 2</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dark-mode">

    <div class="container">
        <!-- Header & Dark Mode Toggle -->
        <div class="header">
            <h1><i class="fas fa-tasks"></i> My To-Do List</h1>
            <button id="themeToggleBtn" type="button" title="Toggle Theme"><i class="fas fa-sun"></i></button>
        </div>
        
        <!-- Input Form with Category, Priority & Due Date -->
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            
            <div class="input-details">
                <select id="categoryInput">
                    <option value="Work">💼 Work</option>
                    <option value="Personal">👤 Personal</option>
                    <option value="Study">📚 Study</option>
                    <option value="Other">📌 Other</option>
                </select>

                <select id="priorityInput">
                    <option value="Low">🟢 Low Priority</option>
                    <option value="Medium" selected>🟡 Medium Priority</option>
                    <option value="High">🔴 High Priority</option>
                </select>

                <input type="date" id="dueDateInput" max="2099-12-31">
            </div>

            <button id="addTaskBtn" type="button"><i class="fas fa-plus"></i> Add Task</button>
        </div>

        <!-- Controls: Search & Filter -->
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search tasks...">
            <select id="filterSelect">
                <option value="all">All Status</option>
                <option value="pending">Pending</option>
                <option value="completed">Completed</option>
            </select>
            <select id="filterCategory">
                <option value="all">All Categories</option>
                <option value="Work">Work</option>
                <option value="Personal">Personal</option>
                <option value="Study">Study</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <!-- Task Stats -->
        <div class="stats">
            <span>Total: <strong id="totalCount">0</strong></span>
            <span>Completed: <strong id="completedCount">0</strong></span>
            <span>Pending: <strong id="pendingCount">0</strong></span>
        </div>

        <!-- Task List -->
        <ul id="taskList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
